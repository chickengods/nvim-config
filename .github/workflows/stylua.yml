name: Validate bootstrap

on:
  pull_request:

jobs:
  bootstrap-check:
    name: Bootstrap Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Validate bootstrap
        run: |
          bash -n install.sh
          shellcheck install.sh
          ruby -c Brewfile
